name: slot-audit

services:
  app:
    build: .
    image: slot-audit-app
    environment:
      PORT: 8000
      DATA_DIR: /data
    volumes:
      - audit_data:/data
    ports:
      # host port is configurable: HOST_PORT=9090 docker compose up app
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: slot-audit-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8000
    command: ["python", "-m", "app.verify"]
    restart: "no"

volumes:
  audit_data:
